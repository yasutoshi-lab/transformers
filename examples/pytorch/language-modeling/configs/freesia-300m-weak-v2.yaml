# freesia-300m-weak (v2): stage 3 on yasutoshi-lab/freesia-weak-cl train (ja keyword/question + en, ~3.15M pairs), 1 epoch
# Curator decision (2026-10-08): Bloom fixed closed (best in the long check), Bloom learning deferred; pooling = mean.
init_from: artifacts/runs/freesia-300m-lm/final
tokenizer: artifacts/tokenizer-v2/v32k
output_dir: artifacts/runs/freesia-300m-weak
init_embed_mode_from: lm
bloom_override: closed
pooling_mode: mean
ja_sources: []
en_sources: []
weakcl_dir: ~/freesia-work/weak-cl/b/hf   # same files as the HF upload (private)
batch_queries: 2048
k_neg: 0
max_query_len: 128
max_doc_len: 256
chunk: 256
temperature: 0.05
false_neg_margin: 0.1
focal_gamma: 0.0
lr: 1.0e-4
warmup_ratio: 0.05
weight_decay: 0.01
epochs: 1
seed: 42
log_every: 10
save_minutes: 30
gradient_checkpointing: true
max_chars: 1200
min_available_gb: 8.0
