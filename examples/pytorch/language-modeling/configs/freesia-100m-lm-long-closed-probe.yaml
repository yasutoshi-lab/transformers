# freesia-100m-lm-long-closed-probe: long contrastive training (full supervised data, 1 epoch) on the LM-pretrained 100M
# Stage 1a probe: short contrastive training on top of the lm-pretrained 100M (design §5/§6).
init_from: artifacts/runs/freesia-100m-lm/final
tokenizer: artifacts/tokenizer/v32k
output_dir: artifacts/runs/freesia-100m-lm-long-closed-probe
init_embed_mode_from: lm
bloom_override: closed
floor_max: 0.3
floor_warmup_ratio: 0.2
bloom_lr_mult: 200.0
ja_queries: null
en_queries: 1500000
max_rows_per_source: 400000
batch_queries: 512
k_neg: 7
max_query_len: 128
max_doc_len: 256
chunk: 256
temperature: 0.05
false_neg_margin: 0.1
focal_gamma: 0.5
lr: 5.0e-5
warmup_ratio: 0.05
weight_decay: 0.01
epochs: 1
seed: 42
log_every: 10
save_minutes: 30
gradient_checkpointing: true
max_chars: 1200
max_neg_pool: 12
min_available_gb: 8.0
