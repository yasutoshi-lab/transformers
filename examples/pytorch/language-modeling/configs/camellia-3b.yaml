# Camellia-3B 事前学習設定（設計書 §1〜§7 準拠・DDP 2GPU）
# =============================================================================
# 総 ~3.07B / 活性 ~0.76B・KDA:MLA 3:1 (NoPE)・DeepSeekMoE 64×top6・MTP D=1
# 60B tokens = EN 40% / JA 30% / 多言語 25%（独仏西中韓）/ コード 5%
# tokens/step = 8192 × 2 × 32 × 2GPU = 1,048,576 → 60B / 1.05M ≈ 57,220 steps
#
# M4 smoke: max_steps を 2000 に置き換え MFU 計測 + resume 検証
#   （MFU < 15% で 2B fallback 発動・設計書 §5）
# 実行:
#   cd examples/pytorch/language-modeling
#   uv run torchrun --nproc_per_node=2 run_camellia_pretrain.py --config configs/camellia-3b.yaml
# =============================================================================

tokenizer_dir: artifacts-1/tokenizer

# ---- モデル（設計書 §1・§3 config 案）----
model:
  vocab_size: 128000
  hidden_size: 1536
  num_hidden_layers: 28
  num_attention_heads: 16
  kv_lora_rank: 384
  q_lora_rank: null
  qk_nope_head_dim: 96
  qk_rope_head_dim: 0
  v_head_dim: 96
  intermediate_size: 4224
  moe_intermediate_size: 320
  n_routed_experts: 64
  n_shared_experts: 1
  num_experts_per_tok: 6
  n_group: 8
  topk_group: 4
  routed_scaling_factor: 2.5
  norm_topk_prob: true
  first_k_dense_replace: 1
  linear_attn_ratio: 3
  kda_num_heads: 12
  kda_head_dim: 128
  short_conv_kernel_size: 4
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  max_position_embeddings: 8192
  tie_word_embeddings: true
  initializer_range: 0.02
  attention_bias: false
  attention_dropout: 0.0
  use_cache: false
  # experts の eager パス: 自前 Python ループの NaiveMoe forward が
  # per-expert 出力 RMS 統計（設計 §6）を持つ。grouped_mm（デフォルト）だと
  # ディスパッチされて統計が死ぬ。実機ベンチ（2026-09-26・Blackwell）では
  # eager ≈ grouped_mm（6.06 vs 6.01 ms/MLP）で差なし。
  experts_implementation: eager
  num_nextn_predict_layers: 1
  mtp_lambda_high: 0.3
  mtp_lambda_low: 0.1
  mtp_lambda_switch_frac: 0.7

attn_implementation: sdpa
gradient_checkpointing: true
torch_compile: false

# ---- データ（§4 混合 60B tokens・M2b 生成）----
data:
  seq_len: 8192
  num_epochs: 1
  train_bins:
    - artifacts-1/packed/train_en.bin
    - artifacts-1/packed/train_ja.bin
    - artifacts-1/packed/train_deu_Latn.bin
    - artifacts-1/packed/train_fra_Latn.bin
    - artifacts-1/packed/train_spa_Latn.bin
    - artifacts-1/packed/train_cmn_Hani.bin
    - artifacts-1/packed/train_kor_Hang.bin
    - artifacts-1/packed/train_code.bin
  val_bins:
    en: artifacts-1/packed/val_en.bin
    ja: artifacts-1/packed/val_ja.bin
    deu_Latn: artifacts-1/packed/val_deu_Latn.bin
    fra_Latn: artifacts-1/packed/val_fra_Latn.bin
    spa_Latn: artifacts-1/packed/val_spa_Latn.bin
    cmn_Hani: artifacts-1/packed/val_cmn_Hani.bin
    kor_Hang: artifacts-1/packed/val_kor_Hang.bin
    code: artifacts-1/packed/val_code.bin

# ---- コールバック間隔（設計書 §6）----
per_domain_eval_every: 500
per_domain_eval_batch_size: 1
per_domain_eval_max_batches: 64
layer_grad_norm_every: 10
throughput_every: 100

moe:
  bias_update_speed: 0.001
  monitor_every: 100

mfu:
  n_active: 0.76e+9
  peak_tflops_per_gpu: 250.0

# ---- Optimizer（設計書 §5）----
muon:
  muon_lr: 0.02        # nanochat 系初期値。M4 smoke の loss 曲線で精査 ★
  adamw_lr: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

# ---- TrainingArguments（設計書 §5）----
training:
  output_dir: artifacts-1/checkpoints/camellia-3b
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 2000
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  max_steps: 57220
  bf16: true
  save_strategy: steps
  save_steps: 2000
  # 設計書は 8（直近5+節目3）だがディスク残量 316GB 制約で当面 4
  # （packed 240GB + CKPT 4×~32GB + 余裕）。要 Curator 確認
  save_total_limit: 4
  logging_strategy: steps
  logging_steps: 10
  report_to: wandb
  eval_strategy: "no"
  # NCCL が cu129 + Blackwell で SIGSEGV（Ranunculus 本番の教訓）
  ddp_backend: gloo
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
  dataloader_pin_memory: true

final_dir: artifacts-1/models/camellia-3b
