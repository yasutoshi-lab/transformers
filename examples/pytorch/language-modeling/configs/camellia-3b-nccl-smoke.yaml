# Camellia-3B NCCL バックエンド検証 smoke 設定（M4 config との差分比較用）
# =============================================================================
# 目的: M4 が gloo で回したのに対し ddp_backend: nccl（NCCL 2.28.9・
#   torch 2.11.0+cu129）での MFU 比較 + 安定性検証（cu129 + Blackwell の
#   SIGSEGV 再発確認。Ranunculus 本番の教訓 = M4 config コメント由来）
#
# 差分（camellia-3b-m4.yaml 比・他は完全に同一 = 同一データ・seed・bs・compile）:
#   - ddp_backend: gloo → nccl
#   - max_steps: 2000 → 300
#   - output_dir/final_dir: camellia-3b-nccl-smoke 個別ディレクトリ
#   - save_steps 500 → 300・save_total_limit 4 → 1
#
# 比較基準（M4 run A 実測）: MFU 8.1/8.1/8.6%（step 100/200/300）・~111 s/it
# =============================================================================

tokenizer_dir: artifacts-0/tokenizer

# ---- モデル（camellia-3b-m4.yaml と同一）----
model:
  vocab_size: 128000
  hidden_size: 1536
  num_hidden_layers: 28
  num_attention_heads: 16
  kv_lora_rank: 384
  q_lora_rank: null
  qk_nope_head_dim: 96
  qk_rope_head_dim: 0
  v_head_dim: 96
  intermediate_size: 4224
  moe_intermediate_size: 320
  n_routed_experts: 64
  n_shared_experts: 1
  num_experts_per_tok: 6
  n_group: 8
  topk_group: 4
  routed_scaling_factor: 2.5
  norm_topk_prob: true
  first_k_dense_replace: 1
  linear_attn_ratio: 3
  kda_num_heads: 12
  kda_head_dim: 128
  short_conv_kernel_size: 4
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  max_position_embeddings: 8192
  tie_word_embeddings: true
  initializer_range: 0.02
  attention_bias: false
  attention_dropout: 0.0
  use_cache: false
  experts_implementation: eager
  num_nextn_predict_layers: 1
  mtp_lambda_high: 0.3
  mtp_lambda_low: 0.1
  mtp_lambda_switch_frac: 0.7

attn_implementation: sdpa
gradient_checkpointing: true
torch_compile: true

# ---- データ（M4 と同一 = 96K packed。MFU 比較のため同一条件を維持）----
data:
  seq_len: 8192
  num_epochs: 1
  train_bins:
    - artifacts-0/packed/train_en.bin
    - artifacts-0/packed/train_ja.bin
  val_bins:
    en: artifacts-0/packed/val_en.bin
    ja: artifacts-0/packed/val_ja.bin

# ---- コールバック間隔（M4 と同一）----
per_domain_eval_every: 500
per_domain_eval_batch_size: 1
per_domain_eval_max_batches: 64
layer_grad_norm_every: 10
throughput_every: 100

moe:
  bias_update_speed: 0.001
  monitor_every: 100

mfu:
  n_active: 0.76e+9
  peak_tflops_per_gpu: 250.0

# ---- Optimizer（M4 と同一）----
muon:
  muon_lr: 0.02
  adamw_lr: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

# ---- TrainingArguments（M4 との差分のみ変更・他は同一）----
training:
  output_dir: artifacts-1/checkpoints/camellia-3b-nccl-smoke
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 2000
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  max_steps: 300
  bf16: true
  save_strategy: steps
  save_steps: 300
  save_total_limit: 1
  logging_strategy: steps
  logging_steps: 10
  report_to: wandb
  eval_strategy: "no"
  remove_unused_columns: false
  # 検証対象: NCCL 2.28.9（cu129 + Blackwell の SIGSEGV 再発確認）
  ddp_backend: nccl
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
  dataloader_pin_memory: true

final_dir: artifacts-1/models/camellia-3b-nccl-smoke
