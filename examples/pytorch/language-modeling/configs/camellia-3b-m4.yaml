# Camellia-3B full smoke 設定（M4・設計書 §7 マイルストーン）
# =============================================================================
# 目的: full config で 2,000 steps を回し
#   (1) MFU 計測（torch.compile + FA(MLA) + fla(KDA) 適用状態。設計書 §5:
#       MFU < 15% で 2B fallback 発動）
#   (2) checkpoint resume 検証（Muon momentum・router バイアス state・
#       dataloader 位置・RNG 含む。checkpoint-1000 で kill → --resume）
#
# ⚠ 96K 流用の理由: 128K tokenizer（M2a）が並行訓練中のため、今回は
#   Ranunculus 96K tokenizer + 96K packed（train_en + train_ja）で実施。
#   embedding 差分（96K vs 128K = +49M）は FLOPs 比 <2% のため
#   MFU ゲートの判定には影響しない。
#
# 実行: run_camellia_m4.sh が tmux 内で run A（0→1000, kill）→
#       run B（--resume checkpoint-1000 → 2000）を自動実行する
# ログ: /tmp/camellia-m4-orch.log（オーケストレーション）・
#       /tmp/camellia-m4-runA.log / runB.log（訓練本体）
# =============================================================================

tokenizer_dir: artifacts-0/tokenizer

# ---- モデル（設計書 §1・§3 config 案・camellia-3b.yaml と同一）----
model:
  vocab_size: 128000
  hidden_size: 1536
  num_hidden_layers: 28
  num_attention_heads: 16
  kv_lora_rank: 384
  q_lora_rank: null
  qk_nope_head_dim: 96
  qk_rope_head_dim: 0
  v_head_dim: 96
  intermediate_size: 4224
  moe_intermediate_size: 320
  n_routed_experts: 64
  n_shared_experts: 1
  num_experts_per_tok: 6
  n_group: 8
  topk_group: 4
  routed_scaling_factor: 2.5
  norm_topk_prob: true
  first_k_dense_replace: 1
  linear_attn_ratio: 3
  kda_num_heads: 12
  kda_head_dim: 128
  short_conv_kernel_size: 4
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  max_position_embeddings: 8192
  tie_word_embeddings: true
  initializer_range: 0.02
  attention_bias: false
  attention_dropout: 0.0
  use_cache: false
  # experts の eager パス: 自前 Python ループの NaiveMoe forward が
  # per-expert 出力 RMS 統計（設計 §6）を持つ。grouped_mm（デフォルト）だと
  # ディスパッチされて統計が死ぬ。実機ベンチ（2026-09-26・Blackwell）では
  # eager ≈ grouped_mm（6.06 vs 6.01 ms/MLP）で差なし。
  experts_implementation: eager
  num_nextn_predict_layers: 1
  mtp_lambda_high: 0.3
  mtp_lambda_low: 0.1
  mtp_lambda_switch_frac: 0.7

attn_implementation: sdpa
gradient_checkpointing: true
# M4 ゲート規定: compile 適用状態で MFU を計測する（設計書 §5 torch_compile: true）
torch_compile: true

# ---- データ（96K 流用・train_en 4.63B + train_ja 1.26B tokens。
#      M4 の需要は 2000 steps × 1.05M = 2.1B tokens なので十分）----
data:
  seq_len: 8192
  num_epochs: 1
  train_bins:
    - artifacts-0/packed/train_en.bin
    - artifacts-0/packed/train_ja.bin
  val_bins:
    en: artifacts-0/packed/val_en.bin
    ja: artifacts-0/packed/val_ja.bin

# ---- コールバック間隔（設計書 §6）----
per_domain_eval_every: 500
per_domain_eval_batch_size: 1
per_domain_eval_max_batches: 64
layer_grad_norm_every: 10
throughput_every: 100

moe:
  bias_update_speed: 0.001
  monitor_every: 100

mfu:
  n_active: 0.76e+9
  peak_tflops_per_gpu: 250.0

# ---- Optimizer（設計書 §5）----
muon:
  muon_lr: 0.02        # nanochat 系初期値。M4 smoke の loss 曲線で精査 ★
  adamw_lr: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

# ---- TrainingArguments（設計書 §5。max_steps 2000 = M4 smoke）----
training:
  output_dir: artifacts-1/checkpoints/camellia-3b-m4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 2000
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  max_steps: 2000
  bf16: true
  save_strategy: steps
  save_steps: 500
  save_total_limit: 4
  logging_strategy: steps
  logging_steps: 10
  report_to: wandb
  eval_strategy: "no"
  # torch.compile 済みモデルの forward シグネチャは (*args, **kwargs) になるため、
  # 既定の remove_unused_columns=True が input_ids/labels を「未使用」として除去し
  # collator が空バッチを受ける（2026-09-26 M4 で再現）
  remove_unused_columns: false
  # NCCL が cu129 + Blackwell で SIGSEGV（Ranunculus 本番の教訓）
  ddp_backend: gloo
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
  dataloader_pin_memory: true

final_dir: artifacts-1/models/camellia-3b-m4
