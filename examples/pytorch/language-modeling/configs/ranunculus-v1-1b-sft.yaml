# Ranunculus-v1-1B SFT（全パラメータ、fp32 master weights + bf16 autocast）
# =============================================================================
# 初期値: 追加学習後のモデル（HF yasutoshi-lab/Ranunculus-v1-1B-PT と同じ重み）
# データ: Apache-2.0 の会話データのみ（llm-jp/oasst2-33k-ja、OpenAssistant/oasst2 の英語）
#         prepare_ranunculus_sft.py で作成。loss は assistant の発話＋<|im_end|> のみ
# 忘却の監視: 事前学習の検証セット（先頭 64 系列）の loss を定期的に測る（リプレイは入れない）
# =============================================================================

init_from: artifacts-3/models/ranunculus-v1-1b-ddp-fp32-continue
tokenizer_dir: artifacts-0/tokenizer
chat_template: artifacts-4/chat_template.jinja
n_regular_vocab: 95744
attn_implementation: sdpa
gradient_checkpointing: true

data:
  train: artifacts-4/data/train
  val: artifacts-4/data/val

pt_val:
  seq_len: 8192
  every: 100
  max_batches: 64
  bins:
    en: artifacts-0/packed/val_en.bin
    ja: artifacts-0/packed/val_ja.bin

training:
  output_dir: artifacts-4/checkpoints/ranunculus-v1-1b-sft

  # 有効バッチ 64 会話 = 8 × 4 × 2GPU。36,052 会話 / 64 ≈ 564 step/epoch
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  train_sampling_strategy: group_by_length

  learning_rate: 2.0e-5
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_ratio: 0.03
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0

  bf16: true

  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 200
  save_total_limit: 3

  logging_strategy: steps
  logging_steps: 5
  report_to: wandb
  run_name: ranunculus-v1-1b-sft
  ddp_backend: nccl
  ddp_find_unused_parameters: false
  remove_unused_columns: false

  seed: 42
  data_seed: 42
  dataloader_num_workers: 2

final_dir: artifacts-4/models/ranunculus-v1-1b-sft
