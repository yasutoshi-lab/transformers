# Camellia-3B 本訓練設定（M5・設計書 §7 マイルストーン）
# =============================================================================
# 目的: 128K tokenizer + 128K packed（8 ドメイン・60.0B tokens）で
#       57,220 steps（1 epoch 相当）の本事前学習を実行する。
#
# 前提（2026-09-30 時点の検証済み事項）:
#   - M4 full smoke（2000 steps）完了: 健全性 PASS（最終 loss 3.128）/
#     MFU gate FAIL（定常 8.8〜9.1% < 15%）— 3B 採用は ADR 上書き済み
#     （raw/dialogues/2026-09-29-camellia-3b-over-mfu-gate.md）
#   - NCCL バックエンド検証 smoke（300 steps）完了: MFU 全点で gloo 優位
#     （+2〜8.7%）→ **ddp_backend: nccl 採用**。単一ノード 2-GPU 環境では
#     RoCE NIC（bnxt_re0）掴みで NCCL init 時 SIGSEGV するため
#     起動時は **NCCL_IB_DISABLE=1** が必須（IB 不使用・性能影響なし）。
#
# データ（artifacts-1/packed・M2b 生成・128K tokenizer 対応）:
#   en 96GB(24B=40%) / ja 72GB(18B=30%) /
#   deu・fra・spa・cmn・kor・code 各 12GB(3B=5%) — 合計 60.0B tokens
#   PackedDataset はファイル連結 + RandomSampler のため、
#   ドメイン比率はファイルサイズ比（= コーパス設計比率）で自動実現される。
#   max_steps 57,220 × 1,048,576 tokens/step = 59.999B tokens ≒ 1 epoch。
#
# 起動: tmux 内で torchrun --nproc_per_node=2 run_camellia_pretrain.py
#       --config configs/camellia-3b-m5.yaml
#       環境変数: NCCL_IB_DISABLE=1 OMP_NUM_THREADS=16 WANDB_PROJECT=camellia
# 想定所要: ~104.5〜110 s/it で 69〜73 日（ADR の revisit 閾値は 115 s/it 超持続）
# =============================================================================

tokenizer_dir: artifacts-1/tokenizer

# ---- モデル（設計書 §1・§3 config 案・M4/NCCL-smoke と同一）----
model:
  vocab_size: 128000
  hidden_size: 1536
  num_hidden_layers: 28
  num_attention_heads: 16
  kv_lora_rank: 384
  q_lora_rank: null
  qk_nope_head_dim: 96
  qk_rope_head_dim: 0
  v_head_dim: 96
  intermediate_size: 4224
  moe_intermediate_size: 320
  n_routed_experts: 64
  n_shared_experts: 1
  num_experts_per_tok: 6
  n_group: 8
  topk_group: 4
  routed_scaling_factor: 2.5
  norm_topk_prob: true
  first_k_dense_replace: 1
  linear_attn_ratio: 3
  kda_num_heads: 12
  kda_head_dim: 128
  short_conv_kernel_size: 4
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  max_position_embeddings: 8192
  tie_word_embeddings: true
  initializer_range: 0.02
  attention_bias: false
  attention_dropout: 0.0
  use_cache: false
  # experts の eager パス: 自前 Python ループの NaiveMoe forward が
  # per-expert 出力 RMS 統計（設計 §6）を持つ。grouped_mm（デフォルト）だと
  # ディスパッチされて統計が死ぬ。実機ベンチ（2026-09-26・Blackwell）では
  # eager ≈ grouped_mm（6.06 vs 6.01 ms/MLP）で差なし。
  experts_implementation: eager
  num_nextn_predict_layers: 1
  mtp_lambda_high: 0.3
  mtp_lambda_low: 0.1
  mtp_lambda_switch_frac: 0.7

attn_implementation: sdpa
gradient_checkpointing: true
# torch.compile 適用状態（M4/NCCL-smoke で安定稼働確認済み）
torch_compile: true

# ---- データ（128K packed・8 ドメイン・60.0B tokens・1 epoch 相当）----
data:
  seq_len: 8192
  num_epochs: 1
  train_bins:
    - artifacts-1/packed/train_en.bin
    - artifacts-1/packed/train_ja.bin
    - artifacts-1/packed/train_deu_Latn.bin
    - artifacts-1/packed/train_fra_Latn.bin
    - artifacts-1/packed/train_spa_Latn.bin
    - artifacts-1/packed/train_cmn_Hani.bin
    - artifacts-1/packed/train_kor_Hang.bin
    - artifacts-1/packed/train_code.bin
  val_bins:
    en: artifacts-1/packed/val_en.bin
    ja: artifacts-1/packed/val_ja.bin
    deu_Latn: artifacts-1/packed/val_deu_Latn.bin
    fra_Latn: artifacts-1/packed/val_fra_Latn.bin
    spa_Latn: artifacts-1/packed/val_spa_Latn.bin
    cmn_Hani: artifacts-1/packed/val_cmn_Hani.bin
    kor_Hang: artifacts-1/packed/val_kor_Hang.bin
    code: artifacts-1/packed/val_code.bin

# ---- コールバック間隔（設計書 §6）----
per_domain_eval_every: 500
per_domain_eval_batch_size: 1
per_domain_eval_max_batches: 64
layer_grad_norm_every: 10
throughput_every: 100

moe:
  bias_update_speed: 0.001
  monitor_every: 100

mfu:
  n_active: 0.76e+9
  peak_tflops_per_gpu: 250.0

# ---- Optimizer（設計書 §5）----
muon:
  muon_lr: 0.015  # 2026-10-03: loss スパイク多発のため 0.02 -> 0.015（checkpoint-2500 から再開）
  adamw_lr: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

# ---- TrainingArguments（設計書 §5。max_steps 57,220 = 60B tokens 本訓練）----
training:
  output_dir: artifacts-1/checkpoints/camellia-3b-m5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 2000
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  max_steps: 57220
  bf16: true
  save_strategy: steps
  save_steps: 500
  save_total_limit: 8
  logging_strategy: steps
  logging_steps: 10
  report_to: wandb
  eval_strategy: "no"
  # torch.compile 済みモデルの forward シグネチャは (*args, **kwargs) になるため、
  # 既定の remove_unused_columns=True が input_ids/labels を「未使用」として除去し
  # collator が空バッチを受ける（2026-09-26 M4 で再現）
  remove_unused_columns: false
  # NCCL 検証 smoke（2026-09-30・300 steps・EXIT=0）で gloo 比 +2〜8.7% 確認。
  # 起動時は NCCL_IB_DISABLE=1 必須（RoCE NIC bnxt_re0 掴みで init SIGSEGV 回避）。
  # 単一ノード 2-GPU DDP は IB を使わないため性能影響なし。
  ddp_backend: nccl
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
  dataloader_pin_memory: true

final_dir: artifacts-1/models/camellia-3b-m5
