# Freesia-100M stage 1a arm: objective=janus (design §6). Paths are relative to examples/pytorch/language-modeling.
objective: janus
janus_masked_ratio: 0.5
mask_rate: 0.2
seed: 42
tokenizer: artifacts/tokenizer/v32k
output_dir: artifacts/runs/freesia-100m-janus
train_files:
  ja: artifacts/packed/ja_train.bin
  en: artifacts/packed/en_train.bin
val_files:
  ja: artifacts/packed/ja_val.bin
  en: artifacts/packed/en_val.bin
model:
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 12
  head_dim: 64
  intermediate_size: 3072
  max_position_embeddings: 1024
seq_len: 1024
micro_batch_size: 16
grad_accum: 32          # 16 x 32 x 1024 = 524,288 tokens / step
max_steps: 3815         # ~2.0B tokens
warmup_steps: 190
lr: 6.0e-4
min_lr: 6.0e-5
weight_decay: 0.1
max_grad_norm: 1.0
log_every: 10
eval_every: 250
eval_batches: 8
save_minutes: 30
gradient_checkpointing: false
