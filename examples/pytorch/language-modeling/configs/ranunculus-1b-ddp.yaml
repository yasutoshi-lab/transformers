# Ranunculus-1B DDP 動作検証用設定
# =============================================================================
# 目的: torchrun 2GPU DDP が正常に動作するかを短時間で確認する
# 実行コマンド:
#   cd examples/pytorch/language-modeling
#   torchrun --nproc_per_node=2 run_ranunculus_pretrain.py --config configs/ranunculus-1b-ddp-test.yaml
# =============================================================================

# ---- トークナイザー ----
tokenizer_dir: artifacts-0/tokenizer

# ---- モデルアーキテクチャ（本番と同一）----
model:
  vocab_size: 96000
  hidden_size: 1536
  num_hidden_layers: 35
  num_attention_heads: 12
  num_key_value_heads: 3
  head_dim: 128
  intermediate_size: 4096
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  max_position_embeddings: 8192
  rope_parameters:
    rope_type: default
    rope_theta: 500000.0
  tie_word_embeddings: true
  attention_bias: false
  attention_dropout: 0.0
  initializer_range: 0.02
  use_cache: false

attn_implementation: sdpa
gradient_checkpointing: true

# ---- データ（本番と同一パス）----
data:
  seq_len: 8192
  num_epochs: 2
  train_bins:
    - artifacts-0/packed/train_en.bin
    - artifacts-0/packed/train_ja.bin
  val_bins:
    en: artifacts-0/packed/val_en.bin
    ja: artifacts-0/packed/val_ja.bin

# ---- コールバック間隔（短縮）----
per_lang_eval_every: 20
per_lang_eval_batch_size: 1
per_lang_eval_max_batches: 8    # 検証を素早く終わらせるため絞る
param_norm_every: 20
tokens_per_sec_every: 5

# ---- TrainingArguments ----
training:
  output_dir: artifacts-1/checkpoints/ranunculus-1b-ddp-test

  # バッチ設定
  # DDP 2GPU: per_device=4 × grad_accum=8 × 2GPU × seq=8192 = 524,288 tokens（本番と同一有効バッチ）
  # VRAM 実測（forward+backward ピーク）:
  #   per_device=4 → 46.6GB/95GB (49%)  optimizer states込み推定 ~59GB (62%) ← 採用
  #   per_device=6 → 68.9GB/95GB (73%)  tok/s は per_device=4 と同等のため効果なし
  #   per_device=8 → OOM
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8

  # 最適化（本番と同一）
  learning_rate: 3.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0

  # スケジューラ
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 10
  lr_scheduler_kwargs:
    min_lr_rate: 0.1

  # 検証用: 30 ステップのみ実行
  max_steps: 30

  # 精度
  bf16: true
  bf16_full_eval: true

  # チェックポイント不要
  save_strategy: "no"

  # ロギング
  logging_strategy: steps
  logging_steps: 5
  report_to: none

  eval_strategy: "no"

  # NCCL が cu129 + Blackwell でクラッシュするため gloo にフォールバック
  ddp_backend: gloo

  seed: 42
  data_seed: 42

  dataloader_num_workers: 2
  dataloader_pin_memory: true

# ---- 最終モデル保存先 ----
final_dir: artifacts-1/models/ranunculus-1b-ddp-test
