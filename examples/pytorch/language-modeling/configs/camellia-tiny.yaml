# Camellia tiny smoke config（M3・設計書 §7 マイルストーン）
# =============================================================================
# 目的: KDA:MLA 3:1 + DeepSeekMoE + MTP + Muon のコードパス検証
#   hidden 128 / 4層 [K,K,K,M] / routed experts 8・100 steps
# ゲート: loss 降下 + expert 負荷が均一化に向かうこと
# 検証用に Ranunculus 96K tokenizer + 既存 packed .bin を流用（M2a 完了後は
# 128K tokenizer + 新データで再実行する）
# 実行:
#   cd examples/pytorch/language-modeling
#   CUDA_VISIBLE_DEVICES=0 python run_camellia_pretrain.py --config configs/camellia-tiny.yaml
# =============================================================================

tokenizer_dir: artifacts-0/tokenizer

# ---- モデル（M3 tiny・設計書 §7）----
model:
  vocab_size: 96000
  hidden_size: 128
  num_hidden_layers: 4
  num_attention_heads: 8
  kv_lora_rank: 32
  q_lora_rank: null
  qk_nope_head_dim: 16
  qk_rope_head_dim: 0
  v_head_dim: 16
  intermediate_size: 384
  moe_intermediate_size: 64
  n_routed_experts: 8
  n_shared_experts: 1
  num_experts_per_tok: 2
  n_group: 2
  topk_group: 1
  routed_scaling_factor: 2.5
  norm_topk_prob: true
  first_k_dense_replace: 1
  linear_attn_ratio: 3
  kda_num_heads: 8
  kda_head_dim: 16
  short_conv_kernel_size: 4
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  max_position_embeddings: 8192
  tie_word_embeddings: true
  initializer_range: 0.02
  attention_bias: false
  attention_dropout: 0.0
  use_cache: false
  num_nextn_predict_layers: 1
  mtp_lambda_high: 0.3
  mtp_lambda_low: 0.1
  mtp_lambda_switch_frac: 0.7

attn_implementation: sdpa
gradient_checkpointing: false
torch_compile: false

# ---- データ（Ranunculus packed .bin を流用）----
data:
  seq_len: 8192
  num_epochs: 1
  train_bins:
    - artifacts-0/packed/train_en.bin
  val_bins: {}

# ---- コールバック間隔（M3 は短め）----
per_domain_eval_every: 1000
layer_grad_norm_every: 10
throughput_every: 10

moe:
  bias_update_speed: 0.001
  monitor_every: 10

mfu:
  n_active: 3.0e7
  peak_tflops_per_gpu: 250.0

# ---- Optimizer（設計書 §5・M3 は検証のみ）----
muon:
  muon_lr: 0.02
  adamw_lr: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

# ---- TrainingArguments ----
training:
  output_dir: artifacts-1/checkpoints/camellia-tiny
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4   # Muon/AdamW とも Scheduler は param_group 初期値から縮小
  max_grad_norm: 1.0
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 20
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  max_steps: 100
  bf16: true
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  logging_strategy: steps
  logging_steps: 5
  report_to: none
  eval_strategy: "no"
  seed: 42
  data_seed: 42
  dataloader_num_workers: 2
  dataloader_pin_memory: true

final_dir: artifacts-1/models/camellia-tiny
