# Llama-3.2-1B SFT（思考切り替え式・空の think を loss から除外・loss は最後の assistant 発話のみ。全パラメータ、fp32 master weights + bf16 autocast）
# =============================================================================
# 初期値: meta-llama/Llama-3.2-1B（素のモデル。Instruct ではない）
# データ: yasutoshi-lab/gemma4-26b-a4b-it-self-distillation から prepare_llama_reasoning_sft.py で作成
#         train 41,280 / validation 1,290 / test 430（最大 8,192 トークン、思考あり/なし半々）
# chat template: Llama 3 形式 + system の /think・/no_think（chat_templates/llama3_reasoning_toggle.jinja）
# ハイパーパラメータは Ranunculus-v1-1B SFT v4 と同じ。違いは GPU 1 枚（16GB）に収めるための次の点:
#   - AdamW の状態を CPU に置く（run_llama_reasoning_sft.py の HostOffloadAdamW。計算は同じ）
#   - Liger の fused linear cross entropy でロジットを展開しない
#   - 有効バッチ 64 会話 = 1 × 64（勾配累積）
# 忘却の監視（事前学習の検証 loss）は、Llama の事前学習データがないため入れない
# =============================================================================

init_from: meta-llama/Llama-3.2-1B
tokenizer_dir: artifacts-llama/tokenizer
chat_template: chat_templates/llama3_reasoning_toggle.jinja
pad_token: <|finetune_right_pad_id|>
# 事前学習で未学習の区切りトークン（埋め込みのノルムが予約トークンと同じ 0.545）
reset_tokens: ["<|start_header_id|>", "<|end_header_id|>", "<|eot_id|>"]
n_regular_vocab: 128000
attn_implementation: sdpa
gradient_checkpointing: true

data:
  train: artifacts-llama/sft-data/train
  val: artifacts-llama/sft-data/validation
  drop_columns: [domain]

training:
  output_dir: artifacts-llama/checkpoints/llama-3.2-1b-reasoning-sft

  # 有効バッチ 64 会話 = 1 × 64
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 64
  num_train_epochs: 2
  train_sampling_strategy: random

  learning_rate: 2.0e-5
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_ratio: 0.03
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0

  bf16: true
  use_liger_kernel: true

  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2

  logging_strategy: steps
  logging_steps: 5
  report_to: none
  run_name: llama-3.2-1b-reasoning-sft
  remove_unused_columns: false
  prediction_loss_only: true

  seed: 42
  data_seed: 42
  dataloader_num_workers: 2

final_dir: artifacts-llama/models/llama-3.2-1b-reasoning-sft
