task: jcommonsenseqa_cloze
dataset_path: json
dataset_kwargs:
  data_files:
    train: artifacts-llama/bench/jcqa_raw/train-v1.3.json
    validation: artifacts-llama/bench/jcqa_raw/valid-v1.3.json
training_split: train
validation_split: validation
fewshot_split: train
num_fewshot: 3
output_type: multiple_choice
doc_to_text: "質問：{{question}}\n答え："
doc_to_choice: "{{[choice0, choice1, choice2, choice3, choice4]}}"
doc_to_target: label
target_delimiter: ""
fewshot_delimiter: "\n\n"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  source: "yahoojapan/JGLUE jcommonsenseqa-v1.3 (GitHub)"
